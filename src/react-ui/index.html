<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onefinity Control</title>
<script>
/* Old Chromium ignores gap on flex containers; mark the page so CSS can use margins instead. */
(function () {
  try {
    var d = document.createElement("div");
    d.style.cssText = "display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden";
    d.appendChild(document.createElement("div")); d.appendChild(document.createElement("div"));
    document.documentElement.appendChild(d);
    var ok = d.scrollHeight === 1;
    document.documentElement.removeChild(d);
    if (!ok) document.documentElement.className += " no-fgap";
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script>
/* If the app cannot start (old browser, script error), say so instead of showing a blank page. */
window.addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && !r.firstChild) r.innerHTML = '<div style="padding:24px;font:18px sans-serif;color:#e4eaf1;line-height:1.5"><b>The interface could not start in this browser.</b><br>' +
    String(e.message || "Unknown error").replace(/</g, "&lt;") + '<br><br><a style="color:#4f8cff" href="/">Reload</a> &nbsp; <a style="color:#4f8cff" href="/api/log">View the controller log</a></div>';
});
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
